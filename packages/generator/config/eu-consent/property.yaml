# Scenario: EU and consent-heavy. What the property IS.
#
# GA4Dataform, the same business software website as config/ecommerce/, sold
# to European visitors in euros (decision D-97). Three things set it apart
# from the e-commerce scenario:
#
#   currency    EUR, so every *_in_usd field converts at usd_exchange_rate
#   languages   each geo reports its own device.language
#   consent     about half of visitors refuse analytics storage (mixer.yaml),
#               so a large share of rows carry no identifiers at all
#
# Comments here cover what is distinctive about this scenario. Every setting is
# documented in full in config/ecommerce/property.yaml.

property:
  stream_id: "7700000301"
  hostname: "ga4dataform.com"
  brand: "GA4Dataform"
  currency: "EUR"
  # Invented and fixed. A real export converts at the day's rate.
  usd_exchange_rate: 1.1
  timezone: "Europe/Berlin"
  default_language: "en-gb"

seed:
  master: "scenario-eu-consent-v1"

ecommerce:
  enabled: true
  # VAT, charged on top of the subtotal as in the other scenarios.
  tax_rate: 0.2
  # Nothing is posted: a plan is software. Both amounts are zero, so every
  # order carries a shipping of 0.00.
  shipping_flat: 0.0
  free_shipping_threshold: 0.0
  transaction_id_prefix: "GD-"
  shipping_tier: "Digital delivery"
  # How a European business pays for software. The consumer instalment and
  # bank checkouts of a retail shop are gone: a company pays by card, through
  # PayPal, by direct debit or by transfer.
  payment_type: {choice: {"Credit Card": 50, PayPal: 25, "SEPA Direct Debit": 20, "Bank transfer": 5}}
  view_item_list_name: "Plan detail"

channels:
  organic_search:
    channel_group: "Organic Search"
    source: google
    medium: organic
    campaign: null
    term: null
    content: null
    referrer: "https://www.google.com/"
    source_weight: 91
    other_sources:
      bing:   {weight: 5, medium: organic, referrer: "https://www.bing.com/"}
      ecosia: {weight: 4, medium: organic, referrer: "https://www.ecosia.org/"}
  direct:
    channel_group: "Direct"
    source: "(direct)"
    medium: "(none)"
    campaign: null
    term: null
    content: null
    referrer: null
  paid_search:
    channel_group: "Paid Search"
    source: google
    medium: cpc
    term: null
    content: null
    campaigns:
      brand-eu:           {weight: 40, term: "ga4dataform", ad_group: "brand-exact"}
      plans-pmax-eu:      {weight: 40, ad_group: "all-plans"}
      nonbrand-export-eu: {weight: 20, term: "ga4 bigquery export", ad_group: "bigquery-export-phrase"}
    gclid: true
    google_ads:
      customer_id: "6634091127"
      account_name: "{brand} | EU Search"
    referrer: "https://www.google.com/"
  paid_social:
    channel_group: "Paid Social"
    source: linkedin
    medium: paid_social
    term: null
    content: null
    campaigns:
      retargeting-trial:      {weight: 55, content: "single-image"}
      prospecting-data-teams: {weight: 45, content: "video-30s"}
    referrer: "https://www.linkedin.com/"
    source_weight: 65
    other_sources:
      youtube: {weight: 35, medium: paid_social, referrer: "https://www.youtube.com/"}
  organic_social:
    channel_group: "Organic Social"
    source: linkedin
    medium: social
    campaign: null
    term: null
    content: null
    referrer: "https://www.linkedin.com/"
    source_weight: 55
    other_sources:
      youtube: {weight: 35, medium: social, referrer: "https://www.youtube.com/"}
      reddit:  {weight: 10, medium: social, referrer: "https://www.reddit.com/"}
  email:
    channel_group: "Email"
    source: newsletter
    medium: email
    term: null
    content: null
    campaigns:
      product-update: 60
      abandoned-cart: 25
      plan-renewal:   15
    referrer: null
  referral:
    channel_group: "Referral"
    source: "analyticsreview.example"
    medium: referral
    campaign: null
    term: null
    content: null
    referrer: "https://analyticsreview.example/reviews/"
    source_weight: 60
    other_sources:
      "datastackweekly.example": {weight: 40, medium: referral, referrer: "https://datastackweekly.example/ga4-models/"}

devices:
  desktop:
    os: ["Windows", "Macintosh"]
    browser: ["Chrome", "Safari", "Edge", "Firefox"]
    brand: []
  mobile:
    os: ["iOS", "Android"]
    browser: ["Chrome", "Safari", "Samsung Internet"]
    brand: ["Apple", "Samsung", "Google", "Xiaomi"]
  tablet:
    os: ["iOS", "Android"]
    browser: ["Chrome", "Safari"]
    brand: ["Apple", "Samsung"]

