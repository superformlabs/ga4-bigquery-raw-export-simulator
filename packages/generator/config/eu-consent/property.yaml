  - {item_id: "GD-PLAN-02", item_name: "Pro plan", category: "Subscriptions", price: 139.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-PLAN-03", item_name: "Business plan", category: "Subscriptions", price: 369.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-PLAN-04", item_name: "Enterprise plan", category: "Subscriptions", price: 899.00, variants: ["Annual"]}
  - {item_id: "GD-ADD-01", item_name: "Attribution add-on", category: "Add-ons", price: 69.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-ADD-02", item_name: "Consent mode add-on", category: "Add-ons", price: 35.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-ADD-03", item_name: "Five extra seats", category: "Add-ons", price: 22.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-SUP-01", item_name: "Priority support", category: "Support", price: 89.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-SRV-01", item_name: "Onboarding workshop", category: "Services", price: 420.00, variants: ["Remote", "On site"]}
  - {item_id: "GD-SRV-02", item_name: "Tracking audit", category: "Services", price: 690.00, variants: ["Remote", "On site"]}

search_terms: ["pricing", "bigquery export", "attribution", "sessions model", "consent mode", "api", "dataform"]

outbound_links:
  - "https://analyticsreview.example/reviews/ga4dataform"
  - "https://www.linkedin.com/company/ga4dataform"

# The same addresses as config/ecommerce/: it is the same website, seen by
# European visitors.
pages:
  home:
    path: "/"
    title: "{brand} | GA4 reporting models for BigQuery"
  features:
    - {path: "/features/data-models", title: "Data models | {brand}", weight: 40}
    - {path: "/features/attribution", title: "Attribution | {brand}", weight: 35}
    - {path: "/features/dashboards", title: "Dashboards | {brand}", weight: 25}
  pricing:
    path: "/pricing"
    title: "Pricing | {brand}"
  docs:
    - {path: "/docs/quickstart", title: "Quickstart | {brand}", weight: 40}
    - {path: "/docs/bigquery-export", title: "The BigQuery export | {brand}", weight: 25}
    - {path: "/docs/sql-models", title: "SQL models | {brand}", weight: 20}
    - {path: "/docs/api", title: "API reference | {brand}", weight: 15}
  plp:
    path: "/plans/{category_slug}"
    title: "{category} | {brand}"
  pdp:
    path: "/product/{item_slug}"
    title: "{item_name} | {brand}"
  search:
    path: "/search?q={search_query}"
    title: "Search results | {brand}"
  blog:
    - {path: "/blog/sessions-in-bigquery", title: "Sessions in BigQuery | {brand}", weight: 35}
    - {path: "/blog/consent-mode-and-modelling", title: "Consent mode and modelling | {brand}", weight: 25}
    - {path: "/blog/attribution-without-guesswork", title: "Attribution without guesswork | {brand}", weight: 25}
    - {path: "/blog/what-a-query-costs", title: "What a query costs | {brand}", weight: 15}
  login:
    - {path: "/login", title: "Log in | {brand}", weight: 70}
    - {path: "/signup", title: "Create your account | {brand}", weight: 30}
  cart:
    path: "/cart"
    title: "Your cart | {brand}"
  checkout:
    path: "/checkout"
    title: "Checkout | {brand}"
  purchased:
    path: "/checkout/thank-you"
    title: "Order confirmed | {brand}"

tracking:
  events:
    scroll: true
    click: true
    view_search_results: true
    view_item_list: true
    select_item: true
    view_item: true
    add_to_cart: true
    view_cart: true
    begin_checkout: true
    add_shipping_info: true
    add_payment_info: true
    purchase: true
  global_params: {}
  params_by_event: {}
  custom_events:
    - name: newsletter_signup
      on_page: [home, blog]
      rate: 0.03
      rate_by_intent: {browsing: 0.3, considering: 2.5, ready: 1.5}
      params: {}
  user_properties: {}
