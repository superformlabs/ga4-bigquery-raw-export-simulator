# Scenario: Lead Generation. How much, and how often.
#
# B2B traffic on the same website as config/ecommerce/ (decision D-97): busy
# on weekdays and in office hours, quiet at the weekend. Buyers take several
# visits to decide, so returning visitors book most of the demos, and paid
# social and content bring people who convert later through direct, email and
# branded search.
#
# Run it with:
#
#   ga4synth summary --scenario lead-generation --date 2026-09-01
#
# Comments here cover what is distinctive about this scenario. Every setting is
# documented in full in config/ecommerce/mixer.yaml.

volume:
  new_visitors_per_day: 500
  weekday_factor: {1: 1.12, 2: 1.15, 3: 1.12, 4: 1.06, 5: 0.92, 6: 0.42, 7: 0.45}
  # Quiet over the summer and the year-end holidays, busiest in early spring.
  seasonality: {amplitude: 0.15, peak_day_of_year: 75}
  jitter: 0.06

retention:
  window_days: 120
  return_base: 0.08
  return_curve:
    - {weight: 0.35, decay_days: 4}
    - {weight: 0.65, decay_days: 40}

# `evaluating` visitors compare vendors over weeks: they return most and book
# most of the demos.
intent:
  segments:
    browsing:   {weight: 72, return_factor: 0.5, conversion_factor: 0.4}
    evaluating: {weight: 22, return_factor: 2.4, conversion_factor: 1.8}
    ready:      {weight: 6,  return_factor: 1.2, conversion_factor: 3.0}
  # First visits rarely book a demo.
  session_number_conversion_factor: [0.3, 0.9, 1.5]
  channel_segment_weights:
    paid_search: {browsing: 45, evaluating: 35, ready: 20}
    paid_social: {browsing: 70, evaluating: 28, ready: 2}
    email:       {browsing: 30, evaluating: 50, ready: 20}
  device_conversion_factor: {desktop: 1.5, mobile: 0.45, tablet: 0.8}

# Demos are booked on weekdays.
demand:
  weekday_conversion_factor: {1: 1.1, 2: 1.12, 3: 1.1, 4: 1.05, 5: 0.9, 6: 0.55, 7: 0.6}
  drift: {sigma: 0.2, period_days: 14}
  daily_noise: 0.18

calendar:
  - {name: product-update, weekday: 3, channels: {email: 3.0}, new_visitors_only: false, returns: 1.2}
  - name: spring-webinar
    from: "03-10"
    to: "03-24"
    traffic: 1.15
    conversion: 1.2
    channels: {email: 2.0, paid_social: 1.8}
    new_visitors_only: false
    campaigns: {email: webinar-invite, paid_social: spring-webinar}
  - name: year-end-planning
    from: "11-01"
    to: "11-30"
    conversion: 1.15
    channels: {paid_search: 1.3}
    new_visitors_only: false
    campaigns: {paid_search: year-end-planning}

acquisition:
  gclid_only_share: 0.25
  calendar_campaign_share: 0.6
  last_non_direct_lookback_days: 30
  # Prospects find the company on their phone through LinkedIn, then book the
  # demo from a computer.
  device_channel_skew:
    mobile: {paid_social: 1.8, organic_social: 1.8}

server_side:
  purchase_share: 0.0
  confirmation_delay_seconds: [20, 900]
  offline_orders:
    enabled: false
    daily_rate: 0.0
    decay_days: 45
    session_id_share: 0.0
    line_item_weights: {1: 1}

session:
  # Office hours.
  hour_weights:
    [0.08, 0.05, 0.04, 0.03, 0.04, 0.08, 0.22, 0.55, 0.9, 1.0, 1.0, 0.95,
     0.85, 0.95, 0.98, 0.92, 0.82, 0.6, 0.38, 0.3, 0.26, 0.2, 0.15, 0.1]
  event_gap_seconds: [5, 45]
  batch_window_seconds: 5
  engaged_min_page_views: 2
  engaged_min_seconds: 10
  source_change_rate: 0.08
  missing_session_start_rate: 0.02
  extra_sessions:
    weights: {0: 82, 1: 14, 2: 4}
    gap_minutes: [120, 360]

consent:
  enabled: true
  analytics_granted: 0.85
  ads_granted: 0.9

# The marketing site has no login, so there is no user_id.
identity:
  user_id_share: 0.0
  cross_device_share: 0.0
  cross_device_max_lag_days: 14
  cross_device_device_mix: {}

channel_mix:
  organic_search: 36
  direct: 20
  paid_search: 18
  paid_social: 10
  organic_social: 5
  email: 6
  referral: 5

device_mix:
  desktop: 68
  mobile: 29
  tablet: 3

geo_mix:
  us_new_york: 30
  us_chicago: 20
  us_los_angeles: 15
  ca_toronto: 10
  uk_london: 12
  au_sydney: 6
  in_bengaluru: 7

returning_channel_skew:
  direct: 3.0
  email: 2.5
  paid_search: 1.3
  paid_social: 0.35
  organic_social: 0.5

# About 2-3% of sessions book a demo, most of them on a later visit.
journey:
  entry_weights:
    home: 32
    features: 18
    blog: 30
    pricing: 10
    docs: 4
    contact: 2
  transitions:
    home:     {features: 28, pricing: 18, docs: 6, blog: 4, contact: 3, search: 2, end: 39}
    features: {features: 8, pricing: 18, docs: 6, contact: 4, home: 2, end: 62}
    pricing:  {contact: 7, features: 10, docs: 4, home: 2, end: 77}
    docs:     {docs: 8, contact: 4, pricing: 8, features: 6, end: 74}
    blog:     {blog: 8, home: 4, features: 4, pricing: 2, end: 82}
    search:   {features: 30, pricing: 20, blog: 15, end: 35}
    contact:  {lead_confirmation: 28, pricing: 4, end: 68}
    lead_confirmation: {home: 3, end: 97}
  form_start_rate: 0.35
  add_to_cart_rate: 0.0
  scroll_rate: 0.32
  outbound_click_rate: 0.01
  max_pages: 12

cart:
  max_line_items: 1
  quantity_weights: {1: 1}

dwell_seconds:
  page_load: [0.2, 1.5]
  select_item: [2, 18]
  view_item: [1, 4]
  add_to_cart: [2, 20]
  add_shipping_info: [8, 40]
  add_payment_info: [6, 30]
  scroll: [3, 20]
  outbound_click: [1, 10]
  custom_event: [2, 12]
  form_start: [3, 20]
  form_submit: [25, 90]

scroll_depth_percent: 90
server_offset_micros: [200000, 4000000]
