# Search terms used by view_search_results.
search_terms: ["tote bag", "merino", "waxed jacket", "wool socks", "belt", "beanie", "chore coat"]

# Outbound links used by the enhanced-measurement `click` event.
outbound_links:
  - "https://gearjournal.example/reviews/northmoor"
  - "https://www.instagram.com/northmoorsupply"

# ---------------------------------------------------------------------------
# Pages
# ---------------------------------------------------------------------------
# Path and title for each page type. Both are templates; available fields are
# {brand}, {category}, {category_slug}, {item_name}, {item_slug}, {search_term}
# and {search_query}, depending on the page type.
#
# The page *type* names are a fixed vocabulary, because the funnel semantics
# attached to them live in code (a pdp emits view_item, a checkout emits
# begin_checkout, and so on). You can freely change what each one looks like;
# you cannot yet invent a new type.
#
# pdp, cart, checkout and purchased require `ecommerce.enabled: true`.
# home, plp, blog and search work either way.
#
# Default type: pdp, cart, checkout and purchased are removed, and must never
# come back here. The plp stays: without a shop it is a section page that
# sends a page_view and no list of products.
pages:
  home:
    path: "/"
    title: "{brand}"
  plp:
    path: "/collections/{category_slug}"
    title: "{category} | {brand}"
  search:
    path: "/search?q={search_query}"
    title: "Search results | {brand}"
  blog:
    path: "/journal/how-we-wax-canvas"
    title: "How we wax canvas | {brand}"

# ---------------------------------------------------------------------------
# Tracking
# ---------------------------------------------------------------------------
# What the property collects. How *often* optional events fire is mixer.yaml.
tracking:
  # Which events this property sends.
  #
  # first_visit, session_start, page_view and user_engagement are absent
  # because GA4 always collects them; they cannot be turned off.
  #
  # The first three mirror the enhanced-measurement toggles in the GA4 admin
  # UI. The rest are the ecommerce funnel, and they are prefix-constrained:
  # the enabled funnel events must form an unbroken run from the top of
  #
  #   view_item -> add_to_cart -> view_cart -> begin_checkout -> purchase
  #
  # because a session containing a later step without an earlier one is
  # exactly what check_funnel_nesting rejects. Turning off view_cart while
  # purchase is on is refused at load time rather than producing broken data.
  #
  # Default type: `ecommerce.enabled: false` already switches off the nine
  # events of a shop. They are also false here, so the file says it twice.
  events:
    scroll: true               # enhanced measurement
    click: true                # enhanced measurement, outbound clicks
    view_search_results: true  # enhanced measurement, site search
    view_item_list: false
    select_item: false
    view_item: false
    add_to_cart: false
    view_cart: false
    begin_checkout: false
    add_shipping_info: false
    add_payment_info: false
    purchase: false

  # Parameters added to every event. Real implementations almost always have a
  # few of these, usually injected by a tag manager.
  #
  # Every value below is written in the same small language:
  #
  #   literal      site_section: "shop"
  #   choice       ab_variant:  {choice: [control, treatment]}
  #                tier:        {choice: {new: 70, vip: 30}}     # weighted
  #   int_range    cart_size:   {int_range: [1, 8]}
  #   float_range  cart_value:  {float_range: [10.0, 400.0], round: 2}
  #   template     landing:     {template: "{page_path}"}
  #
  # Any of them may add `present: 0.15` to appear only some of the time.
  # Template fields: event_name, page_path, page_title, page_location,
  # page_type, hostname, brand, channel, source, medium, campaign,
  # user_pseudo_id, ga_session_id, ga_session_number, device_category,
  # country, currency.
  #
  # GA4's own parameter names are reserved and rejected at load time, so you
  # cannot accidentally overwrite page_location or value.
  global_params: {}
  # Example:
  #   site_section: {template: "{page_type}"}
  #   ab_variant:   {choice: {control: 50, treatment: 50}}

  # Extra parameters on specific standard events, keyed by event name.
  params_by_event: {}
  # Example:
  #   purchase:
  #     delivery_method: {choice: [standard, express, click_and_collect]}
  #   page_view:
  #     content_group: {choice: {shop: 70, editorial: 30}}

  # Events unique to this property. Each fires on the listed page types with the
  # given per-page probability. Standard GA4 event names are rejected here.
  custom_events: []
  # Example:
  #   - name: newsletter_signup
  #     on_page: [blog, home]
  #     rate: 0.06
  #     params:
  #       signup_source: {template: "{page_path}"}

  # User-scoped properties. Values are stable for the lifetime of a visitor and
  # are attached to every one of their events, as GA4 does.
  user_properties: {}
  # Example:
  #   customer_tier:   {choice: {new: 70, returning: 25, vip: 5}}
  #   lifetime_orders: {int_range: [0, 12]}
