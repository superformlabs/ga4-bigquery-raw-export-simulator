# ---------------------------------------------------------------------------
# Product catalogue
# ---------------------------------------------------------------------------
# Prices are in `property.currency`. They are what the software costs: a plan
# is billed monthly or yearly, an add-on sits on top of a plan, and a service
# is bought once. With ecommerce off the prices and variants go unused, but
# plp pages still take their category from here.
#
# `variants` becomes item_variant. For a plan it is the billing term, for a
# service the way it is delivered.
catalogue:
  - {item_id: "GD-PLAN-01", item_name: "Starter plan", category: "Subscriptions", price: 49.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-PLAN-02", item_name: "Pro plan", category: "Subscriptions", price: 149.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-PLAN-03", item_name: "Business plan", category: "Subscriptions", price: 399.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-PLAN-04", item_name: "Enterprise plan", category: "Subscriptions", price: 999.00, variants: ["Annual"]}
  - {item_id: "GD-ADD-01", item_name: "Attribution add-on", category: "Add-ons", price: 79.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-ADD-02", item_name: "Consent mode add-on", category: "Add-ons", price: 39.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-ADD-03", item_name: "Five extra seats", category: "Add-ons", price: 25.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-SUP-01", item_name: "Priority support", category: "Support", price: 99.00, variants: ["Monthly", "Annual"]}
  - {item_id: "GD-SRV-01", item_name: "Onboarding workshop", category: "Services", price: 450.00, variants: ["Remote", "On site"]}
  - {item_id: "GD-SRV-02", item_name: "Tracking audit", category: "Services", price: 750.00, variants: ["Remote", "On site"]}

# Search terms used by view_search_results.
search_terms: ["pricing", "bigquery export", "attribution", "sessions model", "consent mode", "api", "dataform"]

# Outbound links used by the enhanced-measurement `click` event.
outbound_links:
  - "https://analyticsreview.example/reviews/ga4dataform"
  - "https://www.linkedin.com/company/ga4dataform"

# ---------------------------------------------------------------------------
# Pages
# ---------------------------------------------------------------------------
# Path and title for each page type. Both are templates. {brand} works on every
# page; plp adds {category} and {category_slug}; pdp adds {item_name},
# {item_slug} and {item_id}; search adds {search_term} and {search_query}.
#
# Some page types have semantics in code: a pdp emits view_item, a checkout
# emits begin_checkout, a contact page carries a form (form_start,
# form_submit) and lead_confirmation emits generate_lead. Those are home, plp,
# pdp, search, blog, cart, checkout, purchased, contact and lead_confirmation.
# Any other name is a plain page: it sends page_view and the enhanced
# measurement events, nothing else. Walk it in mixer.yaml `journey` like any
# other page.
#
# A page type may also be a list of {path, title, weight} for a type with
# several URLs, such as articles; a visit picks one by weight:
#   blog:
#     - {path: "/blog/query-costs", title: "What a query costs | {brand}", weight: 3}
#     - {path: "/blog/release-notes", title: "Release notes | {brand}", weight: 1}
#
# pdp, cart, checkout and purchased require `ecommerce.enabled: true`.
# home, plp, blog and search work either way: with ecommerce off a plp is a
# plain page_view, without view_item_list.
# The four configurations share this structure, so that the four datasets
# read as one website: home, features, pricing, docs and blog, plus a search
# page and, where the site has a sign-in, a login page.
#
# Default type: pdp, cart, checkout and purchased are removed, and must never
# come back here. The plp stays: without a shop it is a section page that
# sends a page_view and no list of products.
pages:
  home:
    path: "/"
    title: "{brand} | GA4 reporting models for BigQuery"
  features:
    - {path: "/features/data-models", title: "Data models | {brand}", weight: 40}
    - {path: "/features/attribution", title: "Attribution | {brand}", weight: 35}
    - {path: "/features/dashboards", title: "Dashboards | {brand}", weight: 25}
  pricing:
    path: "/pricing"
    title: "Pricing | {brand}"
  docs:
    - {path: "/docs/quickstart", title: "Quickstart | {brand}", weight: 40}
    - {path: "/docs/bigquery-export", title: "The BigQuery export | {brand}", weight: 25}
    - {path: "/docs/sql-models", title: "SQL models | {brand}", weight: 20}
    - {path: "/docs/api", title: "API reference | {brand}", weight: 15}
  plp:
    path: "/plans/{category_slug}"
    title: "{category} | {brand}"
  search:
    path: "/search?q={search_query}"
    title: "Search results | {brand}"
  blog:
    - {path: "/blog/sessions-in-bigquery", title: "Sessions in BigQuery | {brand}", weight: 35}
    - {path: "/blog/consent-mode-and-modelling", title: "Consent mode and modelling | {brand}", weight: 25}
    - {path: "/blog/attribution-without-guesswork", title: "Attribution without guesswork | {brand}", weight: 25}
    - {path: "/blog/what-a-query-costs", title: "What a query costs | {brand}", weight: 15}
  login:
    - {path: "/login", title: "Log in | {brand}", weight: 70}
    - {path: "/signup", title: "Create your account | {brand}", weight: 30}

# ---------------------------------------------------------------------------
# Tracking
# ---------------------------------------------------------------------------
# What the property collects. How *often* optional events fire is mixer.yaml.
tracking:
  # Which events this property sends.
  #
  # first_visit, session_start, page_view and user_engagement are absent
  # because GA4 always collects them; they cannot be turned off.
  #
  # The first three mirror the enhanced-measurement toggles in the GA4 admin
  # UI. The rest are the ecommerce funnel, and they are prefix-constrained:
  # the enabled funnel events must form an unbroken run from the top of
  #
  #   view_item -> add_to_cart -> view_cart -> begin_checkout -> purchase
  #
  # because a session containing a later step without an earlier one is
  # exactly what check_funnel_nesting rejects. Turning off view_cart while
  # purchase is on is refused at load time rather than producing broken data.
  #
  # Default type: `ecommerce.enabled: false` already switches off the nine
  # events of a shop. They are also false here, so the file says it twice.
  events:
    scroll: true               # enhanced measurement
    click: true                # enhanced measurement, outbound clicks
    view_search_results: true  # enhanced measurement, site search
    view_item_list: false
    select_item: false
    view_item: false
    add_to_cart: false
    view_cart: false
    begin_checkout: false
    add_shipping_info: false
    add_payment_info: false
    purchase: false

  # Parameters added to every event. Real implementations almost always have a
  # few of these, usually injected by a tag manager.
  #
  # Every value below is written in the same small language:
  #
  #   literal      site_section: "shop"
  #   choice       ab_variant:  {choice: [control, treatment]}
  #                tier:        {choice: {new: 70, vip: 30}}     # weighted
  #   int_range    cart_size:   {int_range: [1, 8]}
  #   float_range  cart_value:  {float_range: [10.0, 400.0], round: 2}
  #   template     landing:     {template: "{page_path}"}
  #
  # Any of them may add `present: 0.15` to appear only some of the time.
  # Template fields: event_name, page_path, page_title, page_location,
  # page_type, hostname, brand, channel, source, medium, campaign,
  # user_pseudo_id, ga_session_id, ga_session_number, device_category,
  # country, currency.
  #
  # GA4's own parameter names are reserved and rejected at load time, so you
  # cannot accidentally overwrite page_location or value.
  global_params: {}
  # Example:
  #   site_section: {template: "{page_type}"}
  #   ab_variant:   {choice: {control: 50, treatment: 50}}

  # Extra parameters on specific standard events, keyed by event name.
  params_by_event: {}
  # Example:
  #   purchase:
  #     delivery_method: {choice: [standard, express, click_and_collect]}
  #   page_view:
  #     content_group: {choice: {shop: 70, editorial: 30}}

  # Events unique to this property. Each fires on the listed page types with the
  # given per-page probability. Standard GA4 event names are rejected here.
  # Signups mark future buyers.
  #
  # Default type: trial_start is removed. It fires on the pdp, a page this
  # site does not have, and the generator refuses a custom event on a page
  # type that does not exist. A free trial of a plan belongs to the shop
  # anyway.
  custom_events:
    - name: newsletter_signup
      on_page: [blog, home]
      rate: 0.04
      rate_by_intent: {browsing: 0.3, considering: 2.5, ready: 1.5}
      params: {}
  # Example:
  #   - name: newsletter_signup
  #     on_page: [blog, home]
  #     rate: 0.06
  #     rate_by_intent: {browsing: 0.3, considering: 2.5, ready: 1.5}   # optional
  #     params:
  #       signup_source: {template: "{page_path}"}

  # User-scoped properties. Values are stable for the lifetime of a visitor and
  # are attached to every one of their events, as GA4 does. They use the same
  # value language as global_params, but a template can only use
  # {user_pseudo_id}: a user property belongs to no single event.
  user_properties: {}
  # Example:
  #   customer_tier:   {choice: {new: 70, returning: 25, vip: 5}}
  #   lifetime_orders: {int_range: [0, 12]}
