# What the property IS. The Default type of dataset: the same company and the
# same site as config/ecommerce/, without its shop (decisions D-23 and D-97).
#
# GA4Dataform, a business software website: home, features, pricing, docs and
# blog, and no checkout.
#
# This file belongs to the app, not to the generator. It is
# config/ecommerce/property.yaml with four changes, and nothing else:
#
#   ecommerce.enabled        false
#   pages                    pdp, cart, checkout and purchased are removed
#   tracking.events          the nine events of a shop are false
#   tracking.custom_events   trial_start is removed: it fires on the pdp
#
# A test compares the two files and fails on any other difference.
#
# This file defines identity and structure: the site, its products, its pages,
# and what it collects. It answers "what does this property look like", never
# "how much traffic does it get". Every quantitative dial lives in mixer.yaml.
#
# The split is by question, not by convenience:
#
#   property.yaml  what exists          hostname, events, pages, catalogue
#   mixer.yaml     how much, how often  volume, weights, rates, durations
#
# Everything here is invented. No value is derived from real traffic, which is
# why the generated dataset carries no privacy obligation and can be published
# without review.

property:
  # A GA4 stream_id is a numeric string. Invented. Note that this is the data
  # stream id, not the property id: the BigQuery export dataset is named
  # analytics_<property_id>, so the two are different numbers in a real export
  # and are not expected to match.
  stream_id: "7700000002"
  hostname: "ga4dataform.com"
  brand: "GA4Dataform"
  currency: "USD"
  # US dollars per unit of `currency`. The *_in_usd fields (price_in_usd,
  # purchase_revenue_in_usd, event_value_in_usd, ...) hold every amount
  # converted at this rate. Must be 1.0 for USD, and is required otherwise.
  usd_exchange_rate: 1.0
  # device.language for a visitor whose geo sets no `language` of its own.
  default_language: "en-gb"
  # Reporting timezone. Determines which events_YYYYMMDD shard a row lands in,
  # which is the single most common correctness bug in synthetic GA4 data.
  timezone: "America/New_York"

seed:
  # Change this and the entire dataset changes. Keep it fixed once published.
  master: "scenario-ecommerce-v1"

# ---------------------------------------------------------------------------
# Ecommerce
# ---------------------------------------------------------------------------
# `enabled: false` turns this into a content property: the pdp, cart, checkout
# and purchased page types become unavailable, the ecommerce funnel events stop
# firing, and the `ecommerce` struct and `items` array stay NULL on every row,
# exactly as they do in a real non-ecommerce export.
#
# The rates that decide how often people buy live in mixer.yaml; the numbers
# here describe how this particular shop charges.
#
# Default type: the shop is off. Never set this to true in this file; the
# Ecommerce type is the other configuration, config/ecommerce/. The settings
# below are kept as they are and have no effect.
ecommerce:
  enabled: false
  tax_rate: 0.0875
  # Nothing is posted: a plan is software, delivered to the account. Both
  # amounts are zero, so every order carries a shipping of 0.00.
  shipping_flat: 0.0
  # Orders at or above this subtotal ship free. At 0.0 every order does.
  free_shipping_threshold: 0.0
  # Prepended to the 12-digit number that forms every transaction_id.
  transaction_id_prefix: "GD-"
  # The shipping_tier parameter of add_shipping_info and the payment_type
  # parameter of add_payment_info. Each is a literal, or a weighted choice
  # drawn once per session, for example:
  #   shipping_tier: {choice: {Standard: 80, Express: 20}}
  shipping_tier: "Digital delivery"
  # A business pays by card, through PayPal or by bank transfer. The consumer
  # methods of a retail shop are gone.
  payment_type: {choice: {"Credit Card": 70, PayPal: 20, "Bank transfer": 10}}
  # item_list_name on view_item. GA4 records whatever the site sends; null
  # leaves item_list_name, item_list_id and item_list_index NULL.
  view_item_list_name: "Plan detail"

# ---------------------------------------------------------------------------
# Acquisition channels
# ---------------------------------------------------------------------------
# Identity only. How much traffic each one gets is mixer.yaml `channel_mix`,
# and every key here must appear there.
#
# `campaign`, `term` and `content` populate collected_traffic_source and the
# utm-style event_params; null leaves them unset. `gclid: true` marks Google
# Ads paid traffic. `channel_group` is what GA4 reports as
# default_channel_group; left out, the seven shipped channel keys report their
# usual group and any other key reports "Unassigned".
#
# A channel that runs several campaigns at once lists them under `campaigns`
# instead of `campaign`, each with a relative weight. Every acquisition picks
# one. An entry is a bare weight, or a mapping with `weight` and optionally its
# own `term`, `content` and, for Google Ads, `ad_group`. The ad group defaults
# to the campaign name, and the Google Ads ids are derived from the names.
# The channel-level `term` and `content` apply to campaigns that set none.
# Calendar events in mixer.yaml can add a campaign on their days.
#
# A `gclid` channel reports the Google Ads account under `google_ads`:
# `customer_id` (digits) and `account_name`, which may use {brand}.
channels:
  organic_search:
    channel_group: "Organic Search"
    source: google
    medium: organic
    campaign: null
    term: null
    content: null
    referrer: "https://www.google.com/"
    # A channel is rarely one site. `other_sources` lists the rest of it, each
    # with its own referrer, and an optional `medium` if it differs. Weights are
    # relative to `source_weight`, the weight of the `source` above. A channel
    # with a `gclid` cannot use this: a click id belongs to one ad platform.
    source_weight: 90
    other_sources:
      bing:       {weight: 5, medium: organic, referrer: "https://www.bing.com/"}
      duckduckgo: {weight: 3, medium: organic, referrer: "https://duckduckgo.com/"}
      yahoo:      {weight: 2, medium: organic, referrer: "https://search.yahoo.com/"}
  direct:
    channel_group: "Direct"
    source: "(direct)"
    medium: "(none)"
    campaign: null
    term: null
    content: null
    referrer: null
  paid_search:
    channel_group: "Paid Search"
    source: google
    medium: cpc
    term: null
    content: null
    campaigns:
      brand-core:       {weight: 45, term: "ga4dataform", ad_group: "brand-exact"}
      nonbrand-export:  {weight: 30, term: "ga4 bigquery export", ad_group: "bigquery-export-phrase"}
      plans-pmax:       {weight: 20, ad_group: "all-plans"}
      competitor-terms: {weight: 5, term: "ga4 reporting tools", ad_group: "competitors-broad"}
    gclid: true
    google_ads:
      customer_id: "4477112200"
      account_name: "{brand} | Search"
    referrer: "https://www.google.com/"
  paid_social:
    channel_group: "Paid Social"
    source: linkedin
    medium: paid_social
    # The quarterly prospecting campaign comes from the calendar in mixer.yaml.
    # These two run all year beside it.
    campaigns:
      retargeting-trial:    {weight: 60, content: "single-image"}
      lookalike-data-teams: {weight: 40, content: "video-30s"}
    term: null
    content: "carousel-a"
    referrer: "https://www.linkedin.com/"
    source_weight: 70
    other_sources:
      youtube: {weight: 30, medium: paid_social, referrer: "https://www.youtube.com/"}
  organic_social:
    channel_group: "Organic Social"
    source: linkedin
    medium: social
    campaign: null
    term: null
    content: null
    referrer: "https://www.linkedin.com/"
    source_weight: 55
    other_sources:
      youtube:  {weight: 20, medium: social, referrer: "https://www.youtube.com/"}
      reddit:   {weight: 12, medium: social, referrer: "https://www.reddit.com/"}
      x:        {weight: 9,  medium: social, referrer: "https://x.com/"}
      facebook: {weight: 4,  medium: social, referrer: "https://l.facebook.com/"}
  email:
    channel_group: "Email"
    source: newsletter
    medium: email
    term: null
    content: null
    campaigns:
      product-update:    55
      onboarding-series: 20
      abandoned-cart:    15
      plan-renewal:      10
    referrer: null
  referral:
    channel_group: "Referral"
    source: "analyticsreview.example"
    medium: referral
    campaign: null
    term: null
    content: null
    referrer: "https://analyticsreview.example/reviews/"
    source_weight: 45
    other_sources:
      "datastackweekly.example": {weight: 22, medium: referral, referrer: "https://datastackweekly.example/ga4-models/"}
      "chatgpt.com":             {weight: 15, medium: referral, referrer: "https://chatgpt.com/"}
      "bigquerytips.example":    {weight: 10, medium: referral, referrer: "https://bigquerytips.example/"}
      "analyticsforum.example":  {weight: 8,  medium: referral, referrer: "https://analyticsforum.example/threads/"}

# ---------------------------------------------------------------------------
# Devices
# ---------------------------------------------------------------------------
# Identity only; the mix lives in mixer.yaml `device_mix`. `brand` becomes
# device.mobile_brand_name, which real exports leave empty for desktop: an
# empty list leaves it empty.
devices:
  desktop:
    os: ["Windows", "Macintosh"]
    browser: ["Chrome", "Safari", "Edge", "Firefox"]
    brand: []
  mobile:
    os: ["iOS", "Android"]
    browser: ["Chrome", "Safari"]
    brand: ["Apple", "Samsung", "Google", "Xiaomi"]
  tablet:
    os: ["iOS", "Android"]
    browser: ["Chrome", "Safari"]
    brand: ["Apple", "Samsung"]

